name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_name: mllm-backend-aarch64-apple-darwin
            artifact_name: MLLM-macOS-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_name: mllm-backend-x86_64-unknown-linux-gnu
            artifact_name: MLLM-Linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: mllm-backend-x86_64-pc-windows-msvc.exe
            artifact_name: MLLM-Windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          pyinstaller --noconfirm --clean --onefile \
            --name "${{ matrix.sidecar_name }}" \
            --distpath src-tauri/binaries \
            backend/ipc/server.py

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
